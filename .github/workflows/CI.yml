# Runs test/runtests.jl on Linux, Windows and macOS on every push and pull request, and sends the
# coverage (from the Linux run) to Codecov.
# One-off setup: add the repo on codecov.io and save its upload token as the repository
# secret CODECOV_TOKEN (GitHub: Settings > Secrets and variables > Actions).
name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
        if: runner.os == 'Linux'
      - uses: codecov/codecov-action@v5
        if: runner.os == 'Linux'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
